<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk 2077 - Stash Wall Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cpYellow: '#fcee0a',
            cpCyan: '#00f0ff',
            cpRed: '#ff0055',
            cpDark: '#08090d',
            cpPanel: '#12151e',
            cpPanelBorder: '#1f2638',
            cpGray: '#8a99ad',
          },
          fontFamily: {
            orbitron: ['Orbitron', 'sans-serif'],
            rajdhani: ['Rajdhani', 'sans-serif'],
          },
          boxShadow: {
            'neon-yellow': '0 0 15px rgba(252, 238, 10, 0.4)',
            'neon-cyan': '0 0 15px rgba(0, 240, 255, 0.4)',
            'neon-red': '0 0 15px rgba(255, 0, 85, 0.4)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #08090d;
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(252, 238, 10, 0.05) 0%, transparent 40%),
        linear-gradient(to right, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    }

    /* Cyberpunk HUD Cut Corner Utilities */
    .clip-corner {
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }
    .clip-corner-sm {
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }
    .clip-tag {
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
    }

    /* Scanlines effect */
    .scanlines {
      position: relative;
      overflow: hidden;
    }
    .scanlines::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Glitch text effect on hover */
    .glitch-hover:hover {
      text-shadow: 2px 0 #ff0055, -2px 0 #00f0ff;
    }

    /* Custom Checkbox Styling */
    .cyber-checkbox {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #00f0ff;
      background: rgba(0, 240, 255, 0.05);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .cyber-checkbox:checked {
      background: #fcee0a;
      border-color: #fcee0a;
      box-shadow: 0 0 10px rgba(252, 238, 10, 0.6);
    }
    .cyber-checkbox:checked::after {
      content: '✓';
      position: absolute;
      color: #08090d;
      font-weight: 900;
      font-size: 16px;
      top: -2px;
      left: 3px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #08090d;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f2638;
      border: 1px solid #00f0ff;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00f0ff;
    }
  </style>
</head>
<body class="min-h-screen pb-12 scanlines selection:bg-cpYellow selection:text-cpDark">

  <!-- Header Banner -->
  <header class="border-b-2 border-cpYellow bg-cpDark/90 backdrop-blur-md sticky top-0 z-50 shadow-neon-yellow/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        
        <!-- Title & Subtitle -->
        <div>
          <div class="flex items-center gap-3">
            <span class="inline-block w-3 h-6 bg-cpYellow animate-pulse"></span>
            <h1 class="font-orbitron font-black text-2xl sm:text-3xl text-cpYellow tracking-wider uppercase glitch-hover">
              NIGHT CITY // STASH WALL DATABASE
            </h1>
          </div>
          <p class="text-xs sm:text-sm font-rajdhani text-cpGray tracking-widest mt-1 uppercase">
            Cyberpunk 2077 Iconic Weapon Display Matrix [V's Apartment H10]
          </p>
        </div>

        <!-- Global Action Buttons -->
        <div class="flex items-center gap-3 self-end md:self-center">
          <button id="btnCheckAll" onclick="toggleAll(true)" class="clip-corner-sm px-3 py-1.5 bg-cpPanel border border-cpCyan text-cpCyan font-orbitron text-xs tracking-wider uppercase hover:bg-cpCyan hover:text-cpDark transition-all duration-200">
            [+] STASH ALL
          </button>
          <button id="btnUncheckAll" onclick="toggleAll(false)" class="clip-corner-sm px-3 py-1.5 bg-cpPanel border border-cpRed/60 text-cpRed font-orbitron text-xs tracking-wider uppercase hover:bg-cpRed hover:text-white transition-all duration-200">
            [-] UNSTASH ALL
          </button>
          <button id="btnReset" onclick="resetProgress()" class="clip-corner-sm px-3 py-1.5 bg-cpRed/10 border border-cpRed text-cpRed font-orbitron text-xs tracking-wider uppercase hover:bg-cpRed hover:text-cpDark transition-all duration-200">
            RESET
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8">

    <!-- Progress Dashboard Section -->
    <section class="bg-cpPanel border border-cpPanelBorder clip-corner p-6 mb-8 relative overflow-hidden shadow-lg">
      <div class="absolute -right-12 -top-12 w-48 h-48 bg-cpCyan/5 rounded-full filter blur-2xl pointer-events-none"></div>
      
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
        <div>
          <h2 class="font-orbitron text-lg text-white font-bold tracking-widest uppercase flex items-center gap-2">
            <span class="text-cpCyan">//</span> SYSTEM SYNC PROGRESS
          </h2>
          <p id="progressText" class="text-sm font-rajdhani text-cpGray mt-0.5">
            0 / 30 Weapons Stashed (0%)
          </p>
        </div>
        <div id="statusBadge" class="self-start md:self-auto clip-tag bg-cpRed/20 border border-cpRed text-cpRed px-3 py-1 text-xs font-orbitron tracking-widest uppercase">
          SYSTEM INCOMPLETE
        </div>
      </div>

      <!-- Main Progress Bar -->
      <div class="w-full bg-cpDark/80 h-5 border border-cpPanelBorder p-0.5 relative">
        <div id="progressBar" class="h-full bg-gradient-to-r from-cpCyan via-cpYellow to-cpYellow w-0 transition-all duration-500 shadow-neon-yellow"></div>
      </div>

      <!-- Wall Section Stats Breakdown -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6 pt-4 border-t border-cpPanelBorder/60">
        <div class="bg-cpDark/50 p-3 border-l-2 border-cpCyan flex justify-between items-center">
          <span class="text-xs font-orbitron uppercase text-cpGray">LEFT WALL (MELEE/STORY)</span>
          <span id="leftWallCount" class="text-sm font-orbitron font-bold text-cpCyan">0 / 11</span>
        </div>
        <div class="bg-cpDark/50 p-3 border-l-2 border-cpYellow flex justify-between items-center">
          <span class="text-xs font-orbitron uppercase text-cpGray">CENTER WALL (PISTOLS/QUESTS)</span>
          <span id="centerWallCount" class="text-sm font-orbitron font-bold text-cpYellow">0 / 9</span>
        </div>
        <div class="bg-cpDark/50 p-3 border-l-2 border-cpRed flex justify-between items-center">
          <span class="text-xs font-orbitron uppercase text-cpGray">RIGHT WALL (CRAFTED/FIXER)</span>
          <span id="rightWallCount" class="text-sm font-orbitron font-bold text-cpRed">0 / 10</span>
        </div>
      </div>
    </section>

    <!-- Controls & Filters Section -->
    <section class="bg-cpPanel/60 border border-cpPanelBorder clip-corner-sm p-4 mb-8">
      <div class="flex flex-col lg:flex-row gap-4 justify-between items-stretch lg:items-center">
        
        <!-- Search Input -->
        <div class="relative flex-1">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-cpCyan">
            🔍
          </div>
          <input 
            type="text" 
            id="searchInput" 
            oninput="renderWeapons()" 
            placeholder="SEARCH WEAPON NAME, TYPE, OR LOCATION..." 
            class="w-full pl-10 pr-4 py-2 bg-cpDark border border-cpPanelBorder focus:border-cpCyan focus:outline-none text-sm text-white font-rajdhani placeholder-cpGray tracking-wider uppercase transition-colors"
          >
        </div>

        <!-- Filter Controls -->
        <div class="flex flex-wrap items-center gap-2">
          <!-- Wall Location Filters -->
          <div class="flex items-center bg-cpDark border border-cpPanelBorder p-1 clip-corner-sm">
            <button onclick="setWallFilter('ALL')" id="filterWallALL" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase transition-all bg-cpYellow text-cpDark font-bold">ALL</button>
            <button onclick="setWallFilter('LEFT')" id="filterWallLEFT" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all">LEFT</button>
            <button onclick="setWallFilter('CENTER')" id="filterWallCENTER" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all">CENTER</button>
            <button onclick="setWallFilter('RIGHT')" id="filterWallRIGHT" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all">RIGHT</button>
          </div>

          <!-- Collection Status Filters -->
          <div class="flex items-center bg-cpDark border border-cpPanelBorder p-1 clip-corner-sm">
            <button onclick="setStatusFilter('ALL')" id="filterStatusALL" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase transition-all bg-cpCyan text-cpDark font-bold">ANY</button>
            <button onclick="setStatusFilter('UNCOLLECTED')" id="filterStatusUNCOLLECTED" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all">MISSING</button>
            <button onclick="setStatusFilter('COLLECTED')" id="filterStatusCOLLECTED" class="px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all">STASHED</button>
          </div>
        </div>

      </div>
    </section>

    <!-- Weapons Checklist List container -->
    <div id="checklistContainer" class="space-y-8">
      <!-- Generated via JS -->
    </div>

  </main>

  <!-- Script Logic -->
  <script>
    // Database of 30 Stash Wall Weapons organized by Progression Stage
    const STAGE_DEFINITIONS = [
      { id: 1, title: "1. Act 1 & Prologue", desc: "Obtain early before Watson lockdown ends or during The Heist." },
      { id: 2, title: "2. Act 2: Early Quests & Open World", desc: "Available as soon as Watson opens up and Johnny joins you." },
      { id: 3, title: "3. Act 2: NCPD Organized Crime Specs", desc: "Craftable specs looted from NCPD Hustles across Night City." },
      { id: 4, title: "4. Act 2: Main Story & Vendors", desc: "Obtained through mid-game story quests or specialty vendors." },
      { id: 5, title: "5. Act 2 & 3: Companion Questlines", desc: "Unlocked by finishing Panam, Judy, River, Kerry, and Johnny storylines." },
      { id: 6, title: "6. Post-Game Completion", desc: "Requires completing the main storyline." }
    ];

    const WEAPONS_DATA = [
      // Stage 1
      { id: "dying_night", name: "Dying Night", type: "Power Pistol", wall: "Center", stage: 1, loc: "Claim for free from Wilson's gun shop in Megabuilding H10 during the side job 'The Gun'." },
      { id: "nehan", name: "Nehan", type: "Knife", wall: "Left", stage: 1, loc: "Looted directly off Saburo Arasaka's body during 'The Heist'." },
      { id: "satori", name: "Satori", type: "Katana", wall: "Left", stage: 1, loc: "Located inside Saburo's AV on the penthouse helipad during 'The Heist' (head upstairs before leaving)." },
      { id: "kongou", name: "Kongou", type: "Power Pistol", wall: "Center", stage: 1, loc: "Picked up off Yorinobu's bedside table inside the penthouse during 'The Heist'." },

      // Stage 2
      { id: "lizzie", name: "Lizzie", type: "Tech Pistol", wall: "Center", stage: 2, loc: "Found on a server table in the basement/backrooms of Lizzie's Bar starting in Act 2." },
      { id: "plan_b", name: "Plan B", type: "Power Pistol", wall: "Center", stage: 2, loc: "Looted off Dexter DeShawn's corpse at the Scrap Yard in the Badlands." },
      { id: "skippy", name: "Skippy", type: "Smart Pistol", wall: "Center", stage: 2, loc: "Picked up off a corpse in an alleyway in Vista Del Rey, Heywood. (Choose 'Not Returning' to Regina when prompted)." },
      { id: "la_chingona", name: "La Chingona Dorada", type: "Power Pistol (x2)", wall: "Center", stage: 2, loc: "Found on Jackie's shrine at El Coyote Cojo 24h after completing 'Heroes' (must send body to Mama Welles)." },
      { id: "lexington_xmod2", name: "Lexington x-MOD2", type: "Power Pistol", wall: "Right", stage: 2, loc: "Win 1st place in Wilson's shooting competition side job 'Shoot to Thrill'." },
      { id: "cocktail_stick", name: "Cocktail Stick", type: "Katana", wall: "Left", stage: 2, loc: "Found in the VIP dressing room at Clouds during 'Automatic Love'." },
      { id: "errata", name: "Errata", type: "Thermal Katana", wall: "Left", stage: 2, loc: "Inside the furnace room of the Electric Corp station during/after 'Disasterpiece'." },

      // Stage 3
      { id: "buzzsaw", name: "Buzzsaw", type: "SMG (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Yelena Sidorova during 'NCPD Organized Crime: Northside (Watson)'." },
      { id: "psalm_11_6", name: "Psalm 11:6", type: "Assault Rifle (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Tom Ayer during 'NCPD Organized Crime: Northside (Watson)'." },
      { id: "sovereign", name: "Sovereign", type: "Shotgun (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Shinobu Imai during 'NCPD Organized Crime: Japantown (Westbrook)'." },
      { id: "headsman", name: "The Headsman", type: "Shotgun (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from the AH-66 Militech Mech during 'NCPD Organized Crime: North Oak (Westbrook)'." },
      { id: "comrades_hammer", name: "Comrade's Hammer", type: "Tech Revolver (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Darius Miles during 'NCPD Organized Crime: Arroyo (Santo Domingo)'." },
      { id: "breakthrough", name: "Breakthrough", type: "Sniper Rifle (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Olga Elisabeth Longmead during 'NCPD Organized Crime: Rancho Coronado'." },
      { id: "moron_labe", name: "Moron Labe", type: "Assault Rifle (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Anton Kolev during 'NCPD Organized Crime: West Wind Estate (Pacifica)'." },
      { id: "yinglong", name: "Yinglong", type: "Smart SMG (Crafted)", wall: "Right", stage: 3, loc: "Crafting spec looted from Denzel Cryer during 'NCPD Organized Crime: Wellsprings (Heywood)'." },

      // Stage 4
      { id: "sasquatch_hammer", name: "Sasquatch's Hammer", type: "Blunt Weapon", wall: "Left", stage: 4, loc: "Dropped by Sasquatch during the Grand Imperial Mall boss fight in 'I Walk the Line'." },
      { id: "butcher_cleaver", name: "Butcher's Cleaver", type: "Knife", wall: "Left", stage: 4, loc: "Picked up off the butcher table inside the Coastview shop during 'M'ap Tann Pelen'." },
      { id: "blue_fang", name: "Blue Fang", type: "Knife", wall: "Left", stage: 4, loc: "Purchased from the Melee Weapon Vendor in the Southern Badlands." },
      { id: "headhunter", name: "Headhunter", type: "Knife", wall: "Left", stage: 4, loc: "Purchased from the Melee Weapon Vendor in West Wind Estate, Pacifica." },
      { id: "jinchu_maru", name: "Jinchu-Maru", type: "Katana", wall: "Left", stage: 4, loc: "Dropped by Sandayu Oda after defeating him in 'Play It Safe'." },

      // Stage 5
      { id: "overwatch", name: "Overwatch", type: "Sniper Rifle", wall: "Left", stage: 5, loc: "Rewarded by Panam Palmer at the conclusion of her quest 'Riders on the Storm'." },
      { id: "mox", name: "Mox", type: "Shotgun", wall: "Left", stage: 5, loc: "Found on Judy Alvarez's kitchen counter after finishing her complete storyline ('Pyramid Song')." },
      { id: "malorian_3516", name: "Malorian Arms 3516", type: "Power Pistol", wall: "Center", stage: 5, loc: "Johnny Silverhand's gun, looted off Jeremiah Grayson during 'Chippin' In'." },
      { id: "crash", name: "Crash", type: "Power Revolver", wall: "Center", stage: 5, loc: "Given by River Ward at the end of his final storyline quest 'Following the River'." },
      { id: "archangel", name: "Archangel", type: "Power Revolver", wall: "Center", stage: 5, loc: "Given by Kerry Eurodyne after completing the side job 'A Like Supreme'." },

      // Stage 6
      { id: "ba_xing_chong", name: "Ba Xing Chong", type: "Smart Shotgun (Crafted)", wall: "Right", stage: 6, loc: "Crafting spec in Adam Smasher's room on the Ebunike ship. Requires Smasher's keycard after clearing any ending." }
    ];

    // State Variables
    let userState = loadState();
    let wallFilter = 'ALL';
    let statusFilter = 'ALL';

    function loadState() {
      try {
        const saved = localStorage.getItem('cp2077_stash_tracker');
        return saved ? JSON.parse(saved) : {};
      } catch(e) {
        return {};
      }
    }

    function saveState() {
      try {
        localStorage.setItem('cp2077_stash_tracker', JSON.stringify(userState));
      } catch(e) {}
    }

    function toggleWeapon(id) {
      userState[id] = !userState[id];
      saveState();
      updateUI();
    }

    function toggleAll(status) {
      WEAPONS_DATA.forEach(w => {
        userState[w.id] = status;
      });
      saveState();
      updateUI();
    }

    function resetProgress() {
      if (confirm("Are you sure you want to reset all stash progress?")) {
        userState = {};
        saveState();
        updateUI();
      }
    }

    function setWallFilter(filter) {
      wallFilter = filter;
      ['ALL', 'LEFT', 'CENTER', 'RIGHT'].forEach(f => {
        const btn = document.getElementById(`filterWall${f}`);
        if (f === filter) {
          btn.className = "px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase transition-all bg-cpYellow text-cpDark font-bold";
        } else {
          btn.className = "px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all";
        }
      });
      renderWeapons();
    }

    function setStatusFilter(filter) {
      statusFilter = filter;
      ['ALL', 'UNCOLLECTED', 'COLLECTED'].forEach(f => {
        const btn = document.getElementById(`filterStatus${f}`);
        if (f === filter) {
          btn.className = "px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase transition-all bg-cpCyan text-cpDark font-bold";
        } else {
          btn.className = "px-2.5 py-1 text-xs font-orbitron tracking-wider uppercase text-cpGray hover:text-white transition-all";
        }
      });
      renderWeapons();
    }

    function updateUI() {
      // Calculate Stats
      const total = WEAPONS_DATA.length;
      const count = WEAPONS_DATA.filter(w => userState[w.id]).length;
      const percentage = Math.round((count / total) * 100);

      // Wall Stats
      const leftTotal = WEAPONS_DATA.filter(w => w.wall === 'Left').length;
      const leftCount = WEAPONS_DATA.filter(w => w.wall === 'Left' && userState[w.id]).length;

      const centerTotal = WEAPONS_DATA.filter(w => w.wall === 'Center').length;
      const centerCount = WEAPONS_DATA.filter(w => w.wall === 'Center' && userState[w.id]).length;

      const rightTotal = WEAPONS_DATA.filter(w => w.wall === 'Right').length;
      const rightCount = WEAPONS_DATA.filter(w => w.wall === 'Right' && userState[w.id]).length;

      // Update Header Dashboard
      document.getElementById('progressText').innerText = `${count} / ${total} Weapons Stashed (${percentage}%)`;
      document.getElementById('progressBar').style.width = `${percentage}%`;

      document.getElementById('leftWallCount').innerText = `${leftCount} / ${leftTotal}`;
      document.getElementById('centerWallCount').innerText = `${centerCount} / ${centerTotal}`;
      document.getElementById('rightWallCount').innerText = `${rightCount} / ${rightTotal}`;

      const statusBadge = document.getElementById('statusBadge');
      if (count === total) {
        statusBadge.innerText = "WALL COMPLETE 100%";
        statusBadge.className = "self-start md:self-auto clip-tag bg-cpYellow/20 border border-cpYellow text-cpYellow px-3 py-1 text-xs font-orbitron tracking-widest uppercase animate-pulse";
      } else {
        statusBadge.innerText = "SYSTEM INCOMPLETE";
        statusBadge.className = "self-start md:self-auto clip-tag bg-cpRed/20 border border-cpRed text-cpRed px-3 py-1 text-xs font-orbitron tracking-widest uppercase";
      }

      renderWeapons();
    }

    function renderWeapons() {
      const container = document.getElementById('checklistContainer');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      container.innerHTML = '';

      STAGE_DEFINITIONS.forEach(stage => {
        // Filter weapons in this stage
        const stageWeapons = WEAPONS_DATA.filter(w => {
          if (w.stage !== stage.id) return false;

          // Search Filter
          const matchesSearch = w.name.toLowerCase().includes(search) || 
                                w.type.toLowerCase().includes(search) || 
                                w.loc.toLowerCase().includes(search);

          // Wall Filter
          const matchesWall = wallFilter === 'ALL' || w.wall.toUpperCase() === wallFilter;

          // Status Filter
          const isStashed = !!userState[w.id];
          const matchesStatus = statusFilter === 'ALL' || 
                               (statusFilter === 'COLLECTED' && isStashed) || 
                               (statusFilter === 'UNCOLLECTED' && !isStashed);

          return matchesSearch && matchesWall && matchesStatus;
        });

        if (stageWeapons.length === 0) return;

        // Build Stage Section
        const stageEl = document.createElement('div');
        stageEl.className = "space-y-4";

        stageEl.innerHTML = `
          <div class="border-b border-cpCyan/30 pb-2 flex flex-col sm:flex-row sm:items-baseline justify-between gap-1">
            <h3 class="font-orbitron text-lg font-bold text-cpCyan tracking-wider uppercase flex items-center gap-2">
              <span class="w-2 h-2 bg-cpCyan inline-block"></span>
              ${stage.title}
            </h3>
            <span class="text-xs font-rajdhani text-cpGray">${stage.desc}</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${stageWeapons.map(w => renderWeaponCard(w)).join('')}
          </div>
        `;

        container.appendChild(stageEl);
      });

      if (container.children.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-cpPanel/30 border border-dashed border-cpPanelBorder clip-corner">
            <p class="font-orbitron text-cpRed text-base uppercase tracking-wider">NO WEAPONS MATCHING CURRENT MATRIX FILTERS</p>
            <p class="text-xs text-cpGray mt-1">Try loosening search keywords or clearing filter toggles.</p>
          </div>
        `;
      }
    }

    function renderWeaponCard(w) {
      const isStashed = !!userState[w.id];

      // Wall Badge Color
      let wallColor = "text-cpCyan border-cpCyan/40 bg-cpCyan/10";
      if (w.wall === "Center") wallColor = "text-cpYellow border-cpYellow/40 bg-cpYellow/10";
      if (w.wall === "Right") wallColor = "text-cpRed border-cpRed/40 bg-cpRed/10";

      return `
        <div 
          onclick="toggleWeapon('${w.id}')"
          class="clip-corner p-4 cursor-pointer transition-all duration-200 border relative group select-none ${
            isStashed 
              ? 'bg-cpYellow/5 border-cpYellow/80 shadow-neon-yellow/10' 
              : 'bg-cpDark/70 border-cpPanelBorder hover:border-cpCyan/60 hover:bg-cpPanel'
          }"
        >
          <!-- Corner Accent -->
          <div class="absolute top-0 right-0 w-3 h-3 ${isStashed ? 'bg-cpYellow' : 'bg-cpPanelBorder group-hover:bg-cpCyan'}"></div>

          <div class="flex items-start justify-between gap-3 mb-2">
            <div>
              <span class="text-[10px] font-orbitron tracking-widest px-2 py-0.5 border ${wallColor} clip-tag uppercase inline-block mb-1.5">
                ${w.wall} Wall
              </span>
              <h4 class="font-orbitron font-bold text-base ${isStashed ? 'text-cpYellow' : 'text-white group-hover:text-cpCyan'} transition-colors leading-tight">
                ${w.name}
              </h4>
              <p class="text-xs font-orbitron text-cpGray mt-0.5 uppercase tracking-wide">
                ${w.type}
              </p>
            </div>

            <!-- Custom Checkbox -->
            <input 
              type="checkbox" 
              class="cyber-checkbox shrink-0 mt-1" 
              ${isStashed ? 'checked' : ''} 
              onclick="event.stopPropagation(); toggleWeapon('${w.id}')"
            />
          </div>

          <!-- Description / Location -->
          <p class="text-xs text-gray-300 font-rajdhani leading-relaxed mt-3 pt-2 border-t border-cpPanelBorder/40">
            ${w.loc}
          </p>

          <!-- Status Indicator Footer -->
          <div class="mt-3 flex justify-between items-center text-[10px] font-orbitron uppercase tracking-widest">
            <span class="${isStashed ? 'text-cpYellow font-bold' : 'text-cpGray'}">
              ${isStashed ? 'STATUS: STASHED ✓' : 'STATUS: MISSING'}
            </span>
            <span class="text-cpGray/60 group-hover:text-cpCyan transition-colors">
              [CLICK TO TOGGLE]
            </span>
          </div>
        </div>
      `;
    }

    // Initialize Page
    window.onload = function() {
      updateUI();
    };
  </script>
</body>
</html>
